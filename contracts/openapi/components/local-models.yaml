            [
              LocalComputerAcceleratorProbeOk,
              LocalComputerAcceleratorProbeFailed,
            ]
        ram_total_bytes:
          type: integer
          format: int64
          minimum: 0
        apple_silicon:
          type: boolean
        unified_memory_bytes:
          description: Present only on Apple silicon; the memory the CPU and GPU share.
          type: integer
          format: int64
          minimum: 0
        gpus:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/LocalComputerAcceleratorGpu"
