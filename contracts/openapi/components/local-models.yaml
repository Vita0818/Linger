          enum: [none, local, remote]
          x-enum-varnames:
            [
              LocalComputerLocalModelsModeNone,
              LocalComputerLocalModelsModeLocal,
              LocalComputerLocalModelsModeRemote,
            ]
        managed:
          description: The kit was installed by local-models enable, which keeps it upgraded.
